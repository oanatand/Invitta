<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Burgundy Seal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2527"/><stop offset="1" stop-color="#3c1416"/></linearGradient>
    <radialGradient id="wax" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f3ecd2"/><stop offset="1" stop-color="#c9bb8f"/></radialGradient>
    <pattern id="orn" width="24" height="32" patternUnits="userSpaceOnUse">
